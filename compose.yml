name: restaurant-ordering
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ordering
      POSTGRES_USER: ordering
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering -d ordering"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [internal]
  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/ordering
      DB_USERNAME: ordering
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET with at least 32 random characters}
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET with at least 32 random characters}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set exact ALLOWED_ORIGINS}
      GUEST_MENU_URL: ${GUEST_MENU_URL:?Set GUEST_MENU_URL}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    networks: [internal]
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [internal]
volumes:
  postgres-data:
networks:
  internal:
