log_format combined_no_args '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=orders:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wsconnect:10m rate=60r/m;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream ordering_backend { server backend:8080; keepalive 16; }
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    limit_req_status 429;
    # Do not log query strings: QR tokens are carried in resolve requests.
    access_log /var/log/nginx/access.log combined_no_args;
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header Connection "";
    location = /api/orders {
        limit_req zone=orders burst=10 nodelay;
        proxy_pass http://ordering_backend;
    }
    location = /api/staff/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://ordering_backend;
    }
    location /api/ { proxy_pass http://ordering_backend; }
    location = /ws {
        limit_req zone=wsconnect burst=50 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass http://ordering_backend;
    }
    location /actuator/health { proxy_pass http://ordering_backend; }
    location /swagger-ui/ { proxy_pass http://ordering_backend; }
    location /v3/api-docs { proxy_pass http://ordering_backend; }
    location / { return 404; }
    location @too_large {
        default_type application/problem+json;
        return 413 '{"status":413,"code":"REQUEST_TOO_LARGE","detail":"Maximum request size is 32 KiB","path":"$uri","correlationId":"$request_id","timestamp":"$time_iso8601"}';
    }
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        return 429 '{"status":429,"code":"RATE_LIMITED","detail":"Too many requests","path":"$uri","correlationId":"$request_id","timestamp":"$time_iso8601"}';
    }
}
