name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with real PostgreSQL and STOMP
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
      - name: Check packaged application
        run: |
          test -s target/ordering-1.0.0-SNAPSHOT.jar
          jar tf target/ordering-1.0.0-SNAPSHOT.jar > jar-contents.txt
          grep -q BOOT-INF/classes/com/restaurant/ordering/OrderingApplication.class jar-contents.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
